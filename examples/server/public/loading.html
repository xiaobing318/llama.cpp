<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="refresh" content="5">
        <style>
            body, html {
                height: 100%;
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, sans-serif;
            }
            #loading {
                font-size: 18px;
                animation: enlargeText 2.5s infinite;
            }
            @keyframes enlargeText {
                0% {
                    font-size: 18px;
                }
                50% {
                    font-size: 72px;
                }
                100% {
                    font-size: 18px;
                }
            }
            .colored {
                color: #FF5733; /* 你可以选择任何你喜欢的颜色 */
            }
        </style>
    </head>
    <body>
        <div id="loading">
            <span class="colored">DLHJ_Copilot</span>模型正在加载中，请稍等!
        </div>
    </body>
</html>
