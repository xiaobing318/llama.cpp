name: EditorConfig Checker

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: editorconfig-checker/action-editorconfig-checker@v2
        with:
          version: v3.0.3
      - run: editorconfig-checker
      - name: Check for stray metadata files
        run: |
          set -euo pipefail
          matches=$(find . -type f \( -name '.DS_Store' -o -name 'Thumbs.db' -o -name '._*' \))
          if [ -n "$matches" ]; then
            echo "Found disallowed metadata files:"
            echo "$matches"
            exit 1
          fi
          echo "No disallowed metadata files detected."
